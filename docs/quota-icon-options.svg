<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
  <defs>
    <style>
      .bg { fill: #fffaf0; }
      .panel { fill: #fff; stroke: #111; stroke-width: 2; }
      .title { font: 700 26px "Microsoft YaHei", Arial, sans-serif; fill: #111; }
      .label { font: 700 18px "Microsoft YaHei", Arial, sans-serif; fill: #111; }
      .small { font: 600 14px "Microsoft YaHei", Arial, sans-serif; fill: #333; }
      .ink { fill: none; stroke: #111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .red { fill: none; stroke: #f00; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .redThin { fill: none; stroke: #f00; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .redFill { fill: #f00; stroke: #111; stroke-width: 3; stroke-linejoin: round; }
      .whiteFill { fill: #fff; stroke: #111; stroke-width: 3; stroke-linejoin: round; }
      .gray { fill: #f6f1df; stroke: #111; stroke-width: 2.2; }
      .muted { opacity: .45; }
    </style>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 L0 8" stroke="#f00" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect class="bg" width="1120" height="760"/>
  <text class="title" x="36" y="48">5小时额度动态图标方案</text>
  <text class="small" x="36" y="76">从左到右：81-100 满血复活 / 61-80 电量健康 / 41-60 脑袋温热 / 21-40 脑袋发烫 / 0-20 人都麻了</text>

  <text class="label" x="170" y="122">满血复活</text>
  <text class="label" x="365" y="122">电量健康</text>
  <text class="label" x="560" y="122">脑袋温热</text>
  <text class="label" x="755" y="122">脑袋发烫</text>
  <text class="label" x="952" y="122">人都麻了</text>

  <text class="label" x="42" y="190">A 脑袋表情</text>
  <text class="small" x="42" y="214">替代乱线团，最直观</text>
  <text class="label" x="42" y="340">B 电池能量</text>
  <text class="small" x="42" y="364">跟“额度”语义最贴</text>
  <text class="label" x="42" y="490">C 火候温度</text>
  <text class="small" x="42" y="514">对应温热/发烫</text>
  <text class="label" x="42" y="640">D 小火箭</text>
  <text class="small" x="42" y="664">更轻松，适合“造”</text>

